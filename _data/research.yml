- title: "[JMP] Beyond the Jack-of-All-Trades Hypothesis: The Importance of Business and Specialized Skills for Business Ownership Entry and Success"
  type: working_paper
  paper: "/assets/papers/LeeSujin_JMP_beyond_JOAT_hypothesis.pdf"
  presentations: "Southern Economic Association Annual Conference 2025; Federal Reserve Bank of Cleveland–Ohio State University Micro-Macro Workshop 2026; Ohio State University"
  abstract: >-
    Lazear's well-known jack-of-all-trades (JOAT) model (2004, 2005) hypothesizes that business owners require balanced skills—an argument supported by numerous empirical studies, typically by showing that the number of prior occupations or employers held by workers is positively associated with business ownership. I extend the JOAT literature by arguing that (a) business owners do not need a balance of all skills, but instead need a set of business skills plus specialized skills relevant to their business; (b) business skills are likely to be more important for incorporated, capital-intensive, "advanced" businesses than for "basic" businesses; and (c) evidence in support of the JOAT hypothesis is likely to be sensitive to whether skill balance is measured directly or via orthodox, prior mobility measures. Using NLSY79 work histories linked to O*NET data to measure business skills, specialized skills, and skill balance, I find that all three arguments are supported by the data: business skills are strong predictors of entry into advanced (but not basic) business ownership; both business and specialized skills are associated with higher revenue and earnings for all business owners; and my direct measure of skill balance is unassociated with all three outcomes, whereas an orthodox (occupation count) measure strongly predicts entry into basic business ownership largely because it reflects involuntary job loss. In short, I find that business owners benefit from being jacks of business trades rather than jacks of all trades.

- title: "Can a High School Personal Finance Course Reduce the Gender Gap in Being Unbanked?"
  type: working_paper
  paper: "/assets/papers/LeeSujin_Paper_unbanked.pdf"
  presentations: "Ohio State University"
  abstract: >-
    Among unpartnered young adults in the United States (whose banking status reflects their own financial decisions rather than a partner's) women are significantly more likely than men to be unbanked, even after accounting for income and education. I determine whether state-mandated high school personal finance courses reduce this gender gap, and if so, through what mechanisms. Using the FDIC National Survey of Unbanked and Underbanked Households (2009–2023) and a heterogeneity-robust difference-in-differences estimator, I find that mandates reduce the likelihood of being unbanked for both women and men, but by significantly more for women, narrowing the gender gap by 43%. The effects are concentrated among women with no education beyond high school and among Black and Hispanic women—groups that face the greatest barriers to financial inclusion. I find evidence that the following mechanisms help explain these effects: First, the mandates increase women's objective financial knowledge relative to men's, although not their self-assessed knowledge. Second, the mandates increase women's self-employment, likelihood of attaining middle-income status, and college completion rates relative to men's. Because mandatory high school financial education reaches individuals "early" and does not rely on voluntary participation, it appears useful for reducing persistent gender disparities in financial inclusion that adult financial education programs struggle to address.

- title: "Restricting Large Firms to Protect Small Businesses: Evidence from Retail Operating-Day Restrictions"
  type: working_paper
  paper: "/assets/papers/LeeSujin_Paper_retail_shopping_day_restriction.pdf"
  authors:
    - name: "Marco Gonzalez-Navarro"
    - name: "Jaecheol Lee"
  status: "Under review"
  presentations: "North American Meetings of the Urban Economics Association 2023; Pacific Conference for Development Economics 2025; European Meeting of the Urban Economics Association 2025; Ohio State University"
  abstract: "Governments often try to protect small businesses by restricting when or where larger rivals can operate. Whether such policies achieve their objectives depends on how much displaced demand is actually transferred to the intended beneficiaries—a question that requires tracing substitution toward other days, locations, or unregulated sellers—yet direct evidence on these margins remains limited. We study South Korea's policy requiring large retail chains to close two days per month, which provides predetermined variation in closure schedules across districts and weeks. Using high-frequency credit card-transaction data, we estimate that only 18% of displaced spending is redirected to small, independent retailers; larger shares are recouped by restricted chains on other shopping days or diverted to other unrestricted retail formats, many of which are operated by large firms. Consistent with these limited transfers, we find no evidence that the policy improves the long-run survival of independent retailers. Mapping the observed substitution patterns into a discrete-choice framework identified by policy-induced variation in travel time to open stores, we estimate that the consumer welfare losses from restricted access are 2.7 times larger than the gains accruing to independent retailers. These findings suggest that restricting large firms can impose meaningful consumer costs while providing little durable support to the small businesses such policies are intended to protect."

- title: "AI-Related Education Is Increasing and Widespread but Unequal"
  type: work_progress
  authors:
    - name: "Saleh Zakerinia"
    - name: "Harrison Youn"
    - name: "Bruce Weinberg"
    - name: "Tian Lou"
    - name: "Aiday Sikhova"
  presentations: "Ohio State University; Association for Public Policy Analysis and Management Fall Conference 2026"
  abstract: "We develop a comprehensive approach for measuring AI-related education and examine how higher education prepares the workforce for an AI-driven economy. Using a taxonomy of six dimensions of AI-related skills (Core, Foundations, Hardware, Infrastructure, Applications, and Governance) and large language models, we classify all degree and certificate programs in the Integrated Postsecondary Education Data System (IPEDS) as AI-related or not, and use these classifications to document national patterns in AI-related credentials. Using data for Ohio's public postsecondary institutions, we apply our classification to university courses based on descriptions in course catalogs, link these data to student-level enrollment records, and summarize patterns in students' AI-related courses. Finally, using UMETRICS grant data at Ohio State University, we identify instructors engaged in funded AI research and examine which students take courses taught by these instructors. By measuring AI-related education across credentials, coursework, and exposure to AI research, we capture a broader range of AI-related skills developed through higher education than do approaches focused on individuals engaged in developing frontier AI technologies. Our approach provides a broad understanding of the extent to which higher education develops AI-related human capital and how its development varies across fields of study, types of institutions, and student populations. Our framework also lays the groundwork for future research on how AI-related skills shape workers' career trajectories, firm performance, and the broader labor market."

- title: "AI-Related Human Capital Inflows and Gender Composition in Firms"
  type: work_progress
  authors:
    - name: "Tian Lou"
    - name: "Bruce Weinberg"
  presentations: "University of Chicago"
  abstract: >-
    How does a business's exposure to AI influence gender disparities in its workforce? Building on the idea that AI technology is transmitted through human capital, we compare gender compositions and wage gaps at firms that hire AI-trained researchers with those at firms in the same narrowly-defined industry that hire researchers in non-AI fields. By linking Elsevier data on grant information with UMETRICS data that track payment records for all university research employees funded by grants, we measure a grant's "AI intensity" based on the AI publication activity of its principal investigators and an employee's "AI exposure" based on their duration and intensity of work on these AI-related grants. We then follow these researchers into the workforce using Ohio UI earnings records and the Quarterly Census of Employment and Wages to identify businesses that are more likely to have adopted advanced AI by hiring AI-trained researchers. We find that firms hiring AI-trained researchers have a lower share of female employees and wider gender pay gaps (even among non-AI-trained workers) than firms in the same industries that do not hire AI-trained researchers. Our findings suggest that AI adoption can influence gender disparities across the broader workforce, beyond AI researchers and those directly involved in AI development or use.

- title: "Self-Employment Following Job Loss and Subsequent Career Trajectories"
  type: work_progress
  abstract: >-
    Job displacement often leads workers to pursue self-employment, yet little is known about whether these self-employment experiences promote or detract from subsequent earnings growth and employment stability. In this paper, I examine the post-displacement labor market trajectories of workers who enter self-employment after job loss, using data from the 1979 National Longitudinal Survey of Youth (NLSY79). Specifically, I compare subsequent earnings and employment stability between displaced workers who transition into self-employment and similar displaced workers who remain in wage employment, matching on pre-displacement earnings, employment histories, demographic characteristics, and other labor market characteristics. I also examine the characteristics of businesses started by workers who enter self-employment following displacement, including the number of employees and industry classification, to assess whether these businesses generate broader economic benefits beyond individual workers' labor market outcomes. This analysis will reveal the benefits of self-employment to workers' recoveries following job displacement, and inform policies aimed at promoting self-employment as a pathway out of unemployment.

- title: "The Effect of COVID-19 Stimulus Payments on Household Spending"
  type: pre_doc_pub
  authors:
    - name: "Chulhee Lee"
  journal: "Korean Journal of Social Policy"
  detail: "51, 2022, 60-88 (in Korean, non-peer reviewed)."

- title: "The Effect of Child Support Payment Coupons in Response to COVID-19 on Household Spending"
  type: pre_doc_pub
  paper: "https://kea.ne.kr/eng/38/jrnl/18/4977/view"
  authors:
    - name: "Chulhee Lee"
  journal: "The Korean Journal of Economic Studies"
  detail: "69(3), 2021, 5-54 (in Korean, peer reviewed)."
  abstract: "This paper examines the household spending effects of child support payment coupons in South Korea, which were granted to subsidize households suffering from COVID-19. The results of difference-in-differences estimation suggest that child support payment coupons increased household spending by a weekly average of 22,355 South Korean Won (KRW) over 10 weeks, which is 8.8% of the treatment group's average consumption for the period of analysis. Child support payment coupons have positive impacts on supporting both children and small-scale business-owners. The effect on household spending is shown to be significantly larger for low-income households, compared to that of the top 20% of households. We find that coupon redemption replaces some of the household spending that would occur if there was no support from the government. The size of the net effect (weekly average of 22,355 KRW over 10 weeks) is determined by the difference between coupon redemption (57,620 KRW) and the size of the substitution effect (35,256 KRW). These results imply that the net effect of the coupons is estimated to be approximately 39% of the coupon redemption for 10 weeks. We also discuss the implications of our findings on the effects and design of government subsidies."
