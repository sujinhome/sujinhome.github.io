- title: "Restricting Large Retailers: Evidence from South Korea"
  type: working_paper
  paper: "/assets/papers/Mandatory_closure.pdf"
  authors:
    - name: "Marco Gonzalez-Navarro"
    - name: "Jaecheol Lee"
  status: "Submitted"
  presentations: "UEA 2023 (Toronto), PacDev 2025, UEA 2025 (Berlin), Ohio State University"
  abstract: "Regulations that restrict the operating days of large firms are often justified as a means of protecting small competitors. We study South Korea's mandatory shutdown policy, which requires large retail chains to close one day every other week, and quantify how consumer spending adjusts along multiple margins. Using high-frequency transaction data and exploiting within-month variation in closure schedules, we document four substitution channels: diversion to independent retailers, substitution toward other unrestricted retail formats, intertemporal shifting within restricted chains, and spatial substitution across districts with different closure calendars. Only a small share of displaced spending is redirected to independent retailers, while most adjustment occurs through intertemporal substitution within restricted chains and diversion to other unrestricted retail formats operated by large chains. We find no evidence that the policy improves the long-run survival of independent retailers. Mapping observed substitution patterns into a discrete-choice framework, we estimate that consumer welfare losses from restricted access exceed the gains accruing to small retailers by a factor of 2.7, highlighting a fundamental trade-off inherent in protective regulation."

